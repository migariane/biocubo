<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150">
  <!-- Color palette: UGR red (granate), BIO blue, white -->
  <!-- Primary colors -->
  <defs>
    <linearGradient id="ugred-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A1547;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B0F3A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="biored-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="white-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Abstract geometric representation of BIO³ -->
  <!-- Top section: UGR red gradient -->
  <rect x="0" y="0" width="300" height="75" fill="url(#ugred-gradient)"/>
  
  <!-- Bottom section: BIO blue gradient -->
  <rect x="0" y="75" width="300" height="75" fill="url(#biored-gradient)"/>
  
  <!-- White diagonal line separating the sections -->
  <path d="M0,75 C150,0 300,75 300,150 L0,150 Z" fill="white" opacity="0.8"/>
  
  <!-- BIO³ text - left side -->
  <text x="40" y="45" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif" font-size="36" font-weight="bold" fill="white" letter-spacing="2">BIO</text>
  
  <!-- Superscript ³ -->
  <text x="140" y="72" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif" font-size="48" font-weight="bold" fill="#f8fafc" letter-spacing="8">³</text>
  
  <!-- BIOCUBO text - right side -->
  <text x="230" y="105" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif" font-size="30" font-weight="600" fill="white" letter-spacing="1">BIOCUBO</text>
  
  <!-- Optional: small accent elements -->
  <circle cx="50" cy="130" r="8" fill="rgba(255,255,255,0.3)" opacity="0.5"/>
  <circle cx="260" cy="130" r="8" fill="rgba(255,255,255,0.3)" opacity="0.5"/>
  <line x1="50" y1="135" x2="55" y2="130" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <line x1="260" y1="135" x2="265" y2="130" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
</svg>
