<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="340" height="240" role="img" aria-label="BIO³-BIOCUBO">
  <title>BIO³-BIOCUBO</title>
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FC0EE"/>
      <stop offset="100%" stop-color="#6AA5E0"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F74BF"/>
      <stop offset="100%" stop-color="#245FA3"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4E8C"/>
      <stop offset="100%" stop-color="#123A6B"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123A6B"/>
      <stop offset="100%" stop-color="#1B4E8C"/>
    </linearGradient>
  </defs>

  <!-- Isometric cube: top face -->
  <polygon points="170,23 236,60 170,97 104,60" fill="url(#cubeTop)"/>
  <!-- Left face -->
  <polygon points="104,60 170,97 170,169 104,132" fill="url(#cubeLeft)"/>
  <!-- Right face -->
  <polygon points="236,60 170,97 170,169 236,132" fill="url(#cubeRight)"/>

  <!-- Edge highlights -->
  <path d="M170,23 L236,60 L170,97 L104,60 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M170,97 L170,169" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M104,60 L104,132 L170,169 L236,132 L236,60" fill="none" stroke="#0B2E4F" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Subtle top-face sheen -->
  <polygon points="170,35 214,60 170,85 126,60" fill="#FFFFFF" fill-opacity="0.16"/>

  <!-- Wordmark -->
  <text x="170" y="218" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="36" font-weight="700" letter-spacing="1.5"
        fill="url(#wordGrad)">BIO³-BIOCUBO</text>
</svg>
