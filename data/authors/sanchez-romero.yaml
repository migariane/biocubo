bio: |
  Profesor asociado del Departamento de Matemáticas Aplicadas (DMA) de la Universidad de Granada (UGR). Tras varios contratos y estancias en la Universidad Carlos III de Madrid y la UGR, en 2003 presentó su tesis doctoral, que abordaba modelos matemáticos derivados de la teoría de semiconductores y la dinámica gravitacional. Su investigación se centra en las ecuaciones diferenciales, su análisis y aplicaciones de modelización: ecuaciones diferenciales parciales hiperbólicas, sistemas dinámicos basados en modelos cuánticos y sistemas biológicos. Recientemente se ha centrado en herramientas matemáticas para el análisis de componentes galácticos y el modelado de procesos morfogenéticos en el desarrollo embrionario.
